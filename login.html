<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <!-- TEMPLATE_HEADER - Used by Every UI Page -->
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TunaStream</title>
<link rel="icon" type="image/x-icon" href="./images/tunastream.ico">
<link href="./assets/css/tunastream.css" rel="stylesheet" />

  <script type="module" crossorigin src="./assets/login-D39OahSP.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/init-BXreQeTq.js">
  <link rel="stylesheet" crossorigin href="./assets/init-D_k9xtOw.css">
</head>

<body id="app" v-cloak>
  <main role="main" style="max-width: 1200px; margin: 1em auto">
    <div class="d-flex justify-content-center">
      <div class="card auth-card">
        <header class="auth-brand">
          <img src="./images/logo-tunastream-45.png" alt="">
          <span class="brand-word">Tuna<b>Stream</b></span>
        </header>
        <h1 class="auth-title">{{ $t('welcome.sign_in_title') }}</h1>
        <form @submit.prevent="login" class="mt-4">
          <div class="mb-2">
            <label for="usernameInput" class="form-label">{{ $t('_common.username') }}</label>
            <input type="text" class="form-control" id="usernameInput" name="username" autocomplete="username"
              v-model="passwordData.username" required autofocus/>
          </div>
          <div class="mb-2">
            <label for="passwordInput" class="form-label">{{ $t('_common.password') }}</label>
            <input type="password" class="form-control" id="passwordInput" name="password" autocomplete="current-password"
              v-model="passwordData.password" required />
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" v-model="remember"/>
            <label for="rememberMe" class="form-check-label">{{ $t('login.remember_me') }}</label>
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-2" v-bind:disabled="loading">
            {{ $t('welcome.login') }}
          </button>
          <div class="alert alert-danger" v-if="error"><b>{{ $t('_common.error') }}</b> {{error}}</div>
          <div class="alert alert-success" v-if="success">
            <b>{{ $t('_common.success') }}</b> {{ $t('welcome.login_success') }}
          </div>
        </form>
      </div>
    </div>
  </main>
</body>
