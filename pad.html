<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <!-- TEMPLATE_HEADER - Used by Every UI Page -->
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TunaStream</title>
<link rel="icon" type="image/x-icon" href="./images/tunastream.ico">
<link href="./assets/css/tunastream.css" rel="stylesheet" />

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#050b16">
  <style>
    :root {
      --pad-bg: #050b16;
      --pad-face: #0d1a2e;
      --pad-edge: #1f3554;
      --pad-label: #c9d6ea;
      --pad-press: #3fb6e8;
      --pad-a: #3dbb6a;
      --pad-b: #e0504d;
      --pad-x: #3b82e6;
      --pad-y: #e8b93a;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--pad-bg) !important;
      padding: 0 !important;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    .pad {
      position: fixed;
      inset: 0;
      padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto 1fr;
      gap: 8px 12px;
      color: var(--pad-label);
      font-family: system-ui, sans-serif;
    }

    .pad-shoulders {
      display: flex;
      gap: 8px;
    }

    .pad-shoulders.right {
      justify-content: flex-end;
    }

    .pad-btn {
      border: 1px solid var(--pad-edge);
      background: var(--pad-face);
      color: var(--pad-label);
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .pad-btn.on {
      background: var(--pad-press);
      color: #04121f;
      border-color: var(--pad-press);
    }

    .pad-shoulder {
      width: 26%;
      min-width: 64px;
      height: 40px;
    }

    .pad-side {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 8px;
      min-height: 0;
    }

    .pad-side.left {
      flex-direction: row;
    }

    .pad-side.right {
      flex-direction: row-reverse;
    }

    /* Sticks: the one thing that takes most of the hand */
    .pad-stick {
      position: relative;
      width: min(34vh, 34vw, 190px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #12233c 0 55%, var(--pad-face) 56%);
      border: 1px solid var(--pad-edge);
      touch-action: none;
      flex: 0 0 auto;
    }

    .pad-stick.small {
      width: min(26vh, 26vw, 140px);
    }

    .pad-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #2a4669;
      border: 2px solid #4b6f99;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .pad-stick.on .pad-knob {
      background: var(--pad-press);
      border-color: var(--pad-press);
    }

    .pad-dpad {
      display: grid;
      grid-template-columns: repeat(3, min(9vh, 9vw, 52px));
      grid-template-rows: repeat(3, min(9vh, 9vw, 52px));
      gap: 3px;
      flex: 0 0 auto;
    }

    .pad-dpad .pad-btn {
      border-radius: 8px;
    }

    .pad-face {
      position: relative;
      width: min(36vh, 32vw, 200px);
      aspect-ratio: 1;
      flex: 0 0 auto;
    }

    .pad-face .pad-btn {
      position: absolute;
      width: 36%;
      aspect-ratio: 1;
      border-radius: 50%;
      font-size: 20px;
    }

    .pad-face .a { left: 32%; bottom: 0; color: var(--pad-a); }
    .pad-face .b { right: 0; top: 32%; color: var(--pad-b); }
    .pad-face .x { left: 0; top: 32%; color: var(--pad-x); }
    .pad-face .y { left: 32%; top: 0; color: var(--pad-y); }
    .pad-face .pad-btn.on { color: #04121f; }

    .pad-middle {
      grid-row: 1 / span 2;
      grid-column: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 92px;
    }

    .pad-middle .pad-btn {
      width: 76px;
      height: 34px;
      font-size: 12px;
      font-weight: 600;
    }

    .pad-middle .pad-home {
      width: 52px;
      height: 52px;
      border-radius: 50%;
    }

    .pad-player {
      font-size: 13px;
      text-align: center;
      line-height: 1.3;
      opacity: 0.85;
    }

    .pad-player strong {
      display: block;
      font-size: 26px;
      color: var(--pad-press);
    }

    .pad-error {
      color: #ff9b8f;
      font-size: 12px;
      text-align: center;
      max-width: 140px;
    }

    .pad-sheet {
      position: fixed;
      inset: 0;
      background: var(--pad-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 2;
      touch-action: auto;
    }

    .pad-sheet form {
      width: min(100%, 360px);
      color: var(--pad-label);
    }

    .pad-sheet h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }

    .pad-sheet p {
      font-size: 14px;
      opacity: 0.85;
    }

    .pad-turn {
      display: none;
    }

    @media (orientation: portrait) {
      .pad-turn {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 1;
        background: var(--pad-bg);
        color: var(--pad-label);
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
        font-size: 18px;
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/pad-CXZfINCq.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/init-BXreQeTq.js">
  <link rel="stylesheet" crossorigin href="./assets/init-D_k9xtOw.css">
</head>

<body id="app" v-cloak>
  <div class="pad" v-show="joined">
    <div class="pad-shoulders">
      <div class="pad-btn pad-shoulder" :class="{ on: held.lt }" v-press="'lt'">LT</div>
      <div class="pad-btn pad-shoulder" :class="{ on: held.lb }" v-press="'lb'">LB</div>
    </div>
    <div class="pad-shoulders right" style="grid-column: 3">
      <div class="pad-btn pad-shoulder" :class="{ on: held.rb }" v-press="'rb'">RB</div>
      <div class="pad-btn pad-shoulder" :class="{ on: held.rt }" v-press="'rt'">RT</div>
    </div>

    <div class="pad-side left" style="grid-row: 2; grid-column: 1">
      <div class="pad-stick" ref="ls" :class="{ on: sticks.l.active }" @pointerdown="stickDown('l', $event)"
        @pointermove="stickMove('l', $event)" @pointerup="stickUp('l', $event)" @pointercancel="stickUp('l', $event)">
        <div class="pad-knob" :style="knob('l')"></div>
      </div>
      <div class="pad-dpad">
        <span></span>
        <div class="pad-btn" :class="{ on: held.up }" v-press="'up'" aria-label="Up">▲</div>
        <span></span>
        <div class="pad-btn" :class="{ on: held.left }" v-press="'left'" aria-label="Left">◀</div>
        <span></span>
        <div class="pad-btn" :class="{ on: held.right }" v-press="'right'" aria-label="Right">▶</div>
        <span></span>
        <div class="pad-btn" :class="{ on: held.down }" v-press="'down'" aria-label="Down">▼</div>
        <span></span>
      </div>
    </div>

    <div class="pad-middle">
      <div class="pad-player">
        <strong>{{ player ? $t('pad.player', { n: player }) : '…' }}</strong>
        {{ name }}
      </div>
      <div class="pad-btn" :class="{ on: held.back }" v-press="'back'">{{ $t('pad.view') }}</div>
      <div class="pad-btn pad-home" :class="{ on: held.home }" v-press="'home'" :aria-label="$t('pad.home')">⌂</div>
      <div class="pad-btn" :class="{ on: held.start }" v-press="'start'">{{ $t('pad.menu') }}</div>
      <div class="pad-error" v-if="error" role="status">{{ error }}</div>
    </div>

    <div class="pad-side right" style="grid-row: 2; grid-column: 3">
      <div class="pad-face">
        <div class="pad-btn y" :class="{ on: held.y }" v-press="'y'">Y</div>
        <div class="pad-btn x" :class="{ on: held.x }" v-press="'x'">X</div>
        <div class="pad-btn b" :class="{ on: held.b }" v-press="'b'">B</div>
        <div class="pad-btn a" :class="{ on: held.a }" v-press="'a'">A</div>
      </div>
      <div class="pad-stick small" ref="rs" :class="{ on: sticks.r.active }" @pointerdown="stickDown('r', $event)"
        @pointermove="stickMove('r', $event)" @pointerup="stickUp('r', $event)" @pointercancel="stickUp('r', $event)">
        <div class="pad-knob" :style="knob('r')"></div>
      </div>
    </div>
  </div>

  <div class="pad-turn" v-if="joined">{{ $t('pad.turn') }}</div>

  <div class="pad-sheet" v-if="!joined">
    <form @submit.prevent="join">
      <h1>{{ $t('pad.title') }}</h1>
      <p>{{ $t('pad.intro') }}</p>
      <label class="form-label" for="pad-name">{{ $t('pad.your_name') }}</label>
      <input id="pad-name" class="form-control mb-3" v-model="name" maxlength="30" autocomplete="nickname" required>
      <button type="submit" class="btn btn-primary w-100" :disabled="!name.trim()">{{ $t('pad.join') }}</button>
      <p class="mt-3 small" v-if="error" role="status">{{ error }}</p>
    </form>
  </div>

</body>

</html>
